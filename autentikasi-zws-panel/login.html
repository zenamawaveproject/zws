<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | ZWS CMS</title>

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --blue: #1463d6;
            --blue-dark: #0d4fae;
            --text: #172033;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bg: #f5f8fc;
            --danger: #dc2626;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(20, 99, 214, .10),
                    transparent 34%
                ),
                linear-gradient(
                    135deg,
                    #f8fbff 0%,
                    #eef4fb 100%
                );
            color: var(--text);
            font-family: "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button,
        input {
            font-family: inherit;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        /* ==================================================
           BRAND
        ================================================== */

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            width: 62px;
            height: 62px;
            object-fit: contain;
            display: block;
            margin: 0 auto 15px;
        }

        .brand-name {
            color: #111827;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -.5px;
        }

        .brand-name span {
            color: var(--blue);
        }

        .brand-subtitle {
            margin-top: 7px;
            color: var(--muted);
            font-size: 13px;
        }

        /* ==================================================
           CARD
        ================================================== */

        .login-card {
            padding: 32px;
            background: #ffffff;
            border: 1px solid rgba(229, 231, 235, .95);
            border-radius: 18px;
            box-shadow:
                0 18px 50px rgba(15, 23, 42, .08),
                0 2px 8px rgba(15, 23, 42, .03);
        }

        .card-title {
            color: #111827;
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -.4px;
        }

        .card-description {
            margin-top: 8px;
            margin-bottom: 26px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        /* ==================================================
           FORM
        ================================================== */

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 13px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            left: 14px;
            z-index: 2;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 14px;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            height: 48px;
            padding: 0 44px 0 42px;
            outline: none;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #ffffff;
            color: #111827;
            font-size: 14px;
            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .form-input::placeholder {
            color: #a1a1aa;
        }

        .form-input:hover {
            border-color: #d1d5db;
        }

        .form-input:focus {
            border-color: var(--blue);
            box-shadow:
                0 0 0 3px rgba(20, 99, 214, .10);
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 10px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-50%);
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: #9ca3af;
            cursor: pointer;
            font-size: 14px;
            transition:
                color .2s ease,
                background .2s ease;
        }

        .password-toggle:hover {
            background: #f3f4f6;
            color: #4b5563;
        }

        /* ==================================================
           OPTIONS
        ================================================== */

        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 4px 0 22px;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #6b7280;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }

        .remember input {
            width: 15px;
            height: 15px;
            margin: 0;
            accent-color: var(--blue);
            cursor: pointer;
        }

        /* ==================================================
           ERROR
        ================================================== */

        .login-error {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 18px;
            padding: 11px 12px;
            border: 1px solid #fecaca;
            border-radius: 9px;
            background: #fef2f2;
            color: var(--danger);
            font-size: 12px;
            line-height: 1.5;
        }

        .login-error i {
            margin-top: 2px;
            flex-shrink: 0;
        }

        .hidden {
            display: none !important;
        }

        /* ==================================================
           BUTTON
        ================================================== */

        .login-button {
            width: 100%;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            border: 0;
            border-radius: 10px;
            background: var(--blue);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow:
                0 6px 16px rgba(20, 99, 214, .20);
            transition:
                background .2s ease,
                transform .2s ease,
                box-shadow .2s ease;
        }

        .login-button:hover:not(:disabled) {
            background: var(--blue-dark);
            transform: translateY(-1px);
            box-shadow:
                0 8px 20px rgba(20, 99, 214, .24);
        }

        .login-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: .75;
            cursor: not-allowed;
        }

        .login-loader {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, .35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ==================================================
           FOOTER
        ================================================== */

        .login-footer {
            margin-top: 22px;
            text-align: center;
            color: #9ca3af;
            font-size: 11px;
            line-height: 1.6;
        }

        .login-footer strong {
            color: #6b7280;
            font-weight: 600;
        }

        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 480px) {

            body {
                padding: 18px;
            }

            .brand {
                margin-bottom: 22px;
            }

            .brand-logo {
                width: 56px;
                height: 56px;
                margin-bottom: 13px;
            }

            .brand-name {
                font-size: 20px;
            }

            .login-card {
                padding: 25px 21px;
                border-radius: 15px;
            }

            .card-title {
                font-size: 19px;
            }

            .card-description {
                margin-bottom: 22px;
            }

        }

    </style>

</head>

<body>

    <main class="login-wrapper">

        <!-- ==================================================
             BRAND
        ================================================== -->

        <div class="brand">

            <img
                src="https://zenamagroup.com/assets/zws-group.png"
                alt="Zenama Web Services"
                class="brand-logo"
            >

            <div class="brand-name">
                ZWS <span>CMS</span>
            </div>

            <div class="brand-subtitle">
                Zenama Web Services
            </div>

        </div>


        <!-- ==================================================
             LOGIN CARD
        ================================================== -->

        <section class="login-card">

            <h1 class="card-title">
                Selamat datang kembali
            </h1>

            <p class="card-description">
                Masuk ke panel administrasi ZWS untuk
                mengelola website Anda.
            </p>


            <!-- ==================================================
                 ERROR
            ================================================== -->

            <div
                id="login-error"
                class="login-error hidden"
                role="alert"
                aria-live="polite"
            >

                <i class="fa-solid fa-circle-exclamation"></i>

                <span id="login-error-text"></span>

            </div>


            <!-- ==================================================
                 FORM
            ================================================== -->

            <form
                id="login-form"
                autocomplete="on"
                novalidate
            >

                <!-- USERNAME -->

                <div class="form-group">

                    <label
                        for="username"
                        class="form-label"
                    >
                        Username
                    </label>

                    <div class="input-wrapper">

                        <i
                            class="fa-regular fa-user input-icon"
                        ></i>

                        <input
                            id="username"
                            name="username"
                            type="text"
                            class="form-input"
                            placeholder="Masukkan username"
                            autocomplete="username"
                            maxlength="100"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i
                            class="fa-solid fa-lock input-icon"
                        ></i>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            class="form-input"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            maxlength="500"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-password"
                            class="password-toggle"
                            aria-label="Tampilkan password"
                        >
                            <i
                                class="fa-regular fa-eye"
                            ></i>
                        </button>

                    </div>

                </div>


                <!-- OPTIONS -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            id="remember"
                            name="remember"
                            type="checkbox"
                        >

                        <span>
                            Ingat saya
                        </span>

                    </label>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="login-submit"
                    class="login-button"
                >

                    <span
                        id="login-submit-loader"
                        class="login-loader hidden"
                    ></span>

                    <i
                        id="login-submit-icon"
                        class="fa-solid fa-right-to-bracket"
                    ></i>

                    <span id="login-submit-text">
                        Masuk ke Panel
                    </span>

                </button>

            </form>

        </section>


        <!-- ==================================================
             FOOTER
        ================================================== -->

        <div class="login-footer">

            <strong>ZWS CMS</strong>
            &nbsp;·&nbsp;
            Zenama Web Services

            <br>

            Panel administrasi website

        </div>

    </main>


    <!-- ==================================================
         LOGIN JAVASCRIPT
    ================================================== -->

    <script src="/autentikasi-zws-panel/login.js"></script>

</body>
</html>
