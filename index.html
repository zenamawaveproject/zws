<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZWS CMS</title>

<meta id="meta-description" name="description" content="">
<meta id="meta-robots" name="robots" content="index,follow">
<link id="canonical-url" rel="canonical" href="">

<meta id="og-title" property="og:title" content="">
<meta id="og-description" property="og:description" content="">
<meta id="og-image" property="og:image" content="">
<meta property="og:type" content="website">
<meta id="og-url" property="og:url" content="">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>

:root{
    --primary:#2563eb;
    --secondary:#1e40af;
    --dark:#0f172a;
    --text:#334155;
    --muted:#64748b;
    --light:#f8fafc;
    --border:#e2e8f0;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Inter,Arial,sans-serif;
    color:var(--text);
    background:#fff;
    line-height:1.7;
}

img{
    max-width:100%;
}

a{
    text-decoration:none;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding-left:24px;
    padding-right:24px;
}

.section{
    padding:100px 0;
}

.section-alt{
    background:#f8fafc;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--primary);
    font-size:13px;
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-bottom:14px;
}

.eyebrow:before{
    content:"";
    width:28px;
    height:2px;
    background:var(--primary);
    display:block;
}

.section-title{
    margin:0;
    color:var(--dark);
    font-size:clamp(30px,5vw,48px);
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.035em;
}

.section-description{
    margin:18px 0 0;
    color:var(--muted);
    font-size:16px;
    max-width:680px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:48px;
    padding:0 22px;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
    transition:.2s ease;
    cursor:pointer;
}

.btn-primary{
    background:var(--primary);
    color:#fff;
}

.btn-primary:hover{
    background:var(--secondary);
    transform:translateY(-1px);
}

.btn-secondary{
    background:#fff;
    color:var(--dark);
    border:1px solid rgba(255,255,255,.35);
}

.btn-secondary:hover{
    background:#f8fafc;
}

.btn-outline{
    background:#fff;
    color:var(--primary);
    border:1px solid var(--border);
}

.btn-outline:hover{
    border-color:var(--primary);
    background:#eff6ff;
}

.site-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    background:rgba(255,255,255,.94);
    border-bottom:1px solid rgba(226,232,240,.8);
    backdrop-filter:blur(14px);
}

.navbar{
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.brand-logo{
    width:58px;
    height:58px;
    object-fit:contain;
    border-radius:9px;
}

.brand-name{
    color:var(--dark);
    font-size:17px;
    font-weight:800;
    white-space:nowrap;
}

.desktop-nav{
    display:flex;
    align-items:center;
    gap:6px;
}

.desktop-nav a{
    color:#475569;
    padding:9px 13px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    transition:.2s ease;
}

.desktop-nav a:hover{
    color:var(--primary);
    background:#eff6ff;
}

.mobile-button{
    display:none;
    width:42px;
    height:42px;
    border:0;
    background:#f8fafc;
    border-radius:9px;
    cursor:pointer;
    color:var(--dark);
    font-size:20px;
}

.mobile-nav{
    display:none;
    padding:0 0 18px;
}

.mobile-nav.open{
    display:block;
}

.mobile-nav a{
    display:block;
    padding:11px 13px;
    color:#475569;
    font-size:14px;
    font-weight:600;
    border-radius:8px;
}

.mobile-nav a:hover{
    color:var(--primary);
    background:#eff6ff;
}

.hero{
    min-height:760px;
    padding-top:76px;
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;
    background:#f8fafc;
}

.hero-inner{
    position:relative;
    z-index:2;
    width:100%;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.05fr .95fr;
    gap:70px;
    align-items:center;
}

.hero-copy{
    max-width:680px;
}

.hero-title{
    margin:0;
    color:var(--dark);
    font-size:clamp(42px,6vw,72px);
    line-height:1.03;
    letter-spacing:-.055em;
    font-weight:800;
}

.hero-description{
    margin:24px 0 0;
    max-width:620px;
    color:var(--muted);
    font-size:17px;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:32px;
}

.hero-visual{
    position:relative;
}

.hero-image-wrap{
    position:relative;
    overflow:hidden;
    border-radius:22px;
    background:#e2e8f0;
    aspect-ratio:1/1;
    box-shadow:0 30px 80px rgba(15,23,42,.14);
}

.hero-image{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.hero-placeholder{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#94a3b8;
    font-size:14px;
    background:linear-gradient(135deg,#eff6ff,#f8fafc);
}

.about-grid{
    display:grid;
    grid-template-columns:.9fr 1.1fr;
    gap:70px;
    align-items:center;
}

.about-image-wrap{
    overflow:hidden;
    border-radius:20px;
    background:#f1f5f9;
    min-height:430px;
}

.about-image{
    width:100%;
    height:100%;
    min-height:430px;
    object-fit:cover;
    display:block;
}

.about-content{
    color:#475569;
    font-size:16px;
}

.about-content p:first-child{
    margin-top:0;
}

.about-content p:last-child{
    margin-bottom:0;
}

.about-action{
    margin-top:26px;
}

.cards-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:48px;
}

.card{
    height:100%;
    padding:28px;
    border:1px solid var(--border);
    border-radius:16px;
    background:#fff;
    transition:.25s ease;
}

.card:hover{
    transform:translateY(-4px);
    border-color:#bfdbfe;
    box-shadow:0 20px 45px rgba(15,23,42,.08);
}

.card-icon{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:20px;
    border-radius:12px;
    background:#eff6ff;
    color:var(--primary);
    font-size:15px;
    font-weight:800;
    text-align:center;
    overflow:hidden;
}

.card-title{
    margin:0;
    color:var(--dark);
    font-size:18px;
    line-height:1.35;
    font-weight:750;
}

.card-subtitle{
    margin:7px 0 0;
    color:var(--primary);
    font-size:13px;
    font-weight:700;
}

.card-description{
    margin:12px 0 0;
    color:var(--muted);
    font-size:14px;
    line-height:1.7;
}

.process-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:48px;
}

.process-card{
    position:relative;
    padding:28px;
    border-radius:16px;
    background:#fff;
    border:1px solid var(--border);
}

.process-number{
    margin-bottom:18px;
    color:var(--primary);
    font-size:13px;
    font-weight:800;
    letter-spacing:.08em;
}

.contact-box{
    padding:70px 50px;
    border-radius:24px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:#fff;
    position:relative;
    overflow:hidden;
}

.contact-box:after{
    content:"";
    position:absolute;
    width:340px;
    height:340px;
    border-radius:50%;
    right:-140px;
    top:-160px;
    border:70px solid rgba(255,255,255,.08);
}

.contact-inner{
    position:relative;
    z-index:2;
    max-width:780px;
}

.contact-title{
    margin:0;
    font-size:clamp(30px,5vw,48px);
    line-height:1.15;
    letter-spacing:-.035em;
    font-weight:800;
}

.contact-description{
    margin:18px 0 0;
    color:rgba(255,255,255,.8);
    font-size:16px;
}

.contact-action{
    margin-top:28px;
}

.footer{
    padding:70px 0 30px;
    background:#0f172a;
    color:#94a3b8;
}

.footer-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr;
    gap:60px;
}

.footer-brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.footer-logo{
    width:42px;
    height:42px;
    object-fit:contain;
}

.footer-brand-name{
    color:#fff;
    font-size:17px;
    font-weight:800;
}

.footer-description{
    max-width:430px;
    margin:20px 0 0;
    font-size:14px;
    line-height:1.8;
}

.footer-title{
    margin:0 0 17px;
    color:#fff;
    font-size:14px;
    font-weight:750;
}

.footer-links{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.footer-links a{
    color:#94a3b8;
    font-size:14px;
    transition:.2s ease;
}

.footer-links a:hover{
    color:#fff;
}

.footer-contact{
    display:flex;
    flex-direction:column;
    gap:9px;
    font-size:14px;
}

.footer-contact a{
    color:#94a3b8;
}

.footer-contact a:hover{
    color:#fff;
}

.footer-bottom{
    margin-top:55px;
    padding-top:22px;
    border-top:1px solid rgba(148,163,184,.15);
    display:flex;
    justify-content:space-between;
    gap:20px;
    font-size:13px;
}

.cms-hidden{
    display:none!important;
}

.loading{
    min-height:400px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#64748b;
    font-size:14px;
}

.error-box{
    margin:100px auto;
    max-width:700px;
    padding:30px;
    border:1px solid #fecaca;
    border-radius:14px;
    background:#fef2f2;
    color:#991b1b;
}

@media(max-width:900px){

    .desktop-nav{
        display:none;
    }

    .mobile-button{
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .hero{
        min-height:auto;
        padding-top:130px;
        padding-bottom:80px;
    }

    .hero-grid,
    .about-grid{
        grid-template-columns:1fr;
        gap:45px;
    }

    .hero-title{
        font-size:clamp(40px,10vw,62px);
    }

    .cards-grid,
    .process-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .footer-grid{
        grid-template-columns:1fr 1fr;
    }

    .footer-main{
        grid-column:1/-1;
    }

}

@media(max-width:640px){

    .container{
        padding-left:18px;
        padding-right:18px;
    }

    .section{
        padding:75px 0;
    }

    .navbar{
        height:68px;
    }

    .brand-logo{
        width:54px;
        height:54px;
    }

    .brand-name{
        font-size:15px;
    }

    .hero{
        padding-top:115px;
        padding-bottom:70px;
    }

    .hero-title{
        font-size:42px;
    }

    .hero-description{
        font-size:15px;
    }

    .hero-actions{
        flex-direction:column;
        align-items:stretch;
    }

    .hero-actions .btn{
        width:100%;
    }

    .cards-grid,
    .process-grid,
    .footer-grid{
        grid-template-columns:1fr;
    }

    .contact-box{
        padding:45px 25px;
        border-radius:18px;
    }

    .footer-main{
        grid-column:auto;
    }

    .footer-bottom{
        flex-direction:column;
    }

}

</style>

</head>

<script>

/* ==================================================
   ZWS CMS TEMPLATE RUNTIME
   API SESUAI functions/api/cms.js
================================================== */

(function(){

"use strict";


/* ==================================================
   KONFIGURASI API
================================================== */

const API_URL = "/api/cms?action=home";


/* ==================================================
   GLOBAL DATA
================================================== */

window.__ZWS_HOME__ = null;
window.__SITE_SETTINGS__ = {};
window.__SEO__ = {};
window.__CONTACT__ = {};
window.__NAVIGATION__ = [];
window.__PAGE__ = {};
window.__SECTIONS__ = [];


/* ==================================================
   HELPER DOM
================================================== */

function $(id){
    return document.getElementById(id);
}


function setText(id,value){

    const el = $(id);

    if(!el) return;

    el.textContent =
        value === null ||
        value === undefined
            ? ""
            : String(value);

}


function setHTML(id,value){

    const el = $(id);

    if(!el) return;

    el.innerHTML =
        value === null ||
        value === undefined
            ? ""
            : String(value);

}


function setAttr(id,attr,value){

    const el = $(id);

    if(!el) return;

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        el.removeAttribute(attr);

        return;

    }

    el.setAttribute(
        attr,
        String(value)
    );

}


function show(id){

    const el = $(id);

    if(!el) return;

    el.classList.remove(
        "cms-hidden"
    );

}


function hide(id){

    const el = $(id);

    if(!el) return;

    el.classList.add(
        "cms-hidden"
    );

}


function escapeHTML(value){

    return String(
        value === null ||
        value === undefined
            ? ""
            : value
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function safeURL(value){

    if(!value) return "";

    const url =
        String(value).trim();

    if(
        url.startsWith("/") ||
        url.startsWith("#") ||
        url.startsWith("./") ||
        url.startsWith("../")
    ){

        return url;

    }

    try{

        const parsed =
            new URL(
                url,
                window.location.origin
            );

        if(
            parsed.protocol === "http:" ||
            parsed.protocol === "https:"
        ){

            return parsed.href;

        }

    }catch{}

    return "";

}


/* ==================================================
   API GET
================================================== */

async function getJSON(url){

    const separator =
        url.includes("?")
            ? "&"
            : "?";

    const requestURL =
        url +
        separator +
        "_=" +
        Date.now();

    const response =
        await fetch(
            requestURL,
            {
                method:"GET",
                credentials:"include",
                cache:"no-store",
                headers:{
                    "Accept":
                        "application/json"
                }
            }
        );

    if(!response.ok){

        throw new Error(
            "API HTTP " +
            response.status
        );

    }

    const data =
        await response.json();

    if(
        data &&
        data.success === false
    ){

        throw new Error(
            data.error ||
            "API mengembalikan error."
        );

    }

    return data;

}


/* ==================================================
   SECTION SETTINGS
================================================== */

function sectionSettings(section){

    if(!section){

        return {};

    }

    if(
        section.settings &&
        typeof section.settings === "object"
    ){

        return section.settings;

    }

    if(
        section.settings_json
    ){

        try{

            const parsed =
                JSON.parse(
                    section.settings_json
                );

            if(
                parsed &&
                typeof parsed === "object"
            ){

                return parsed;

            }

        }catch(error){

            console.warn(
                "settings_json tidak valid:",
                error
            );

        }

    }

    return {};

}


/* ==================================================
   FIND SECTION
================================================== */

function findSection(
    sections,
    key
){

    if(!Array.isArray(sections)){

        return null;

    }

    const normalized =
        String(key)
            .toLowerCase()
            .trim();

    return (
        sections.find(
            section =>
                String(
                    section.section_key || ""
                )
                .toLowerCase()
                .trim() === normalized
        ) ||
        sections.find(
            section =>
                String(
                    section.section_type || ""
                )
                .toLowerCase()
                .trim() === normalized
        ) ||
        null
    );

}

function applyTheme(settings){

    if(!settings) return;

    const primary =
        settings.primary_color;

    const secondary =
        settings.secondary_color;

                "--primary",

    if(secondary){

        document.documentElement.style
            .setProperty(
                "--secondary",

            );

}

function initMobileMenu(){

    const button =
        $("mobile-menu-button");

    const navigation =
        $("mobile-navigation");

    if(
        !button ||
        !navigation
    ){

        return;

    }


    button.addEventListener(
        "click",
        function(){

            const open =
                navigation.classList
                    .toggle("open");

            button.setAttribute(
                "aria-expanded",
                open
                    ? "true"
                    : "false"
            );

            button.textContent =
                open
                    ? "✕"
                    : "☰";

        }
    );


    navigation.addEventListener(
        "click",
        function(event){

            if(
                event.target.tagName ===
                "A"
            ){

                navigation.classList
                    .remove("open");

                button.setAttribute(
                    "aria-expanded",
                    "false"
                );

                button.textContent =
                    "☰";

            }

        }
    );

}

                : [];


        window.__PAGE__ =
            data.page || {};


        window.__SECTIONS__ =
            Array.isArray(
                data.sections
            )
                ? data.sections
                : [];


        /* ==========================================
           RENDER
        ========================================== */

        renderSettings(
            window.__SITE_SETTINGS__
        );


        renderSEO(
            window.__SEO__
        );


        renderNavigation(
            window.__NAVIGATION__
        );


        renderFooterNavigation(
            window.__NAVIGATION__
        );


        renderPage(
            window.__PAGE__,
            window.__SECTIONS__
        );


        renderFooterContact(
            window.__SITE_SETTINGS__,
            window.__CONTACT__
        );


        /* ==========================================
           TAMPILKAN WEBSITE
        ========================================== */

        hide(
            "loading-state"
        );

        show(
            "dynamic-content"
        );


        document.documentElement
            .setAttribute(
                "data-zws-loaded",
                "true"
            );


        console.log(
            "ZWS CMS berhasil dimuat.",
            data
        );


    }catch(error){

        console.error(
            "ZWS CMS LOAD ERROR:",
            error
        );


        hide(
            "loading-state"
        );


        const content =
            $("dynamic-content");

        if(content){

            content.innerHTML = `

                <div class="container">

                    <div class="error-box">

                        <strong>
                            Website gagal memuat data CMS.
                        </strong>

                        <p style="margin:10px 0 0;">
                            ${escapeHTML(
                                error.message ||
                                "Terjadi kesalahan."
                            )}
                        </p>

                    </div>

                </div>

            `;

            show(
                "dynamic-content"
            );

        }

    }

}


/* ==================================================
   INIT
================================================== */

function init(){

    initMobileMenu();

    loadCMS();

}


if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        init
    );

}else{

    init();

}

})();

</script>

</body>
</html>
