<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title id="site-title">Loading...</title>
<meta id="meta-description" name="description" content="">
<meta id="meta-robots" name="robots" content="index,follow">
<link id="canonical-url" rel="canonical" href="">

<meta id="og-title" property="og:title" content="">
<meta id="og-description" property="og:description" content="">
<meta id="og-image" property="og:image" content="">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --primary:#1463d6;
  --secondary:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
  --surface:#f8fafc;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  color:var(--text);
  background:#fff;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
button,a{transition:.2s ease}
.section{
  width:100%;
  padding:96px 20px;
}
.container{
  width:100%;
  max-width:1180px;
  margin:auto;
}
.section-heading{
  max-width:720px;
  margin:0 auto 55px;
  text-align:center;
}
.section-heading .eyebrow{
  color:var(--primary);
  font-size:13px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:12px;
}
.section-heading h2{
  margin:0;
  font-size:clamp(30px,4vw,44px);
  line-height:1.15;
  font-weight:800;
  letter-spacing:-.03em;
}
.section-heading p{
  margin:18px 0 0;
  color:var(--muted);
  line-height:1.8;
}
.hero{
  position:relative;
  min-height:680px;
  display:flex;
  align-items:center;
  overflow:hidden;
  background:#f8fafc;
}
.hero-bg{
  position:absolute;
  inset:0;
  z-index:0;
}
.hero-bg img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.hero-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(255,255,255,.98),rgba(255,255,255,.88),rgba(255,255,255,.35));
}
.hero-content{
  position:relative;
  z-index:2;
  max-width:1180px;
  width:100%;
  margin:auto;
  padding:100px 20px;
}
.hero-inner{
  max-width:720px;
}
.hero-eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 13px;
  border:1px solid rgba(20,99,214,.15);
  background:rgba(255,255,255,.8);
  border-radius:999px;
  color:var(--primary);
  font-size:13px;
  font-weight:700;
  margin-bottom:22px;
}
.hero-title{
  margin:0;
  font-size:clamp(42px,6vw,72px);
  line-height:1.04;
  font-weight:800;
  letter-spacing:-.045em;
}
.hero-description{
  max-width:650px;
  margin:25px 0 0;
  color:#4b5563;
  font-size:17px;
  line-height:1.8;
}
.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:34px;
}
.btn{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  min-height:48px;
  padding:0 22px;
  border-radius:10px;
  font-size:14px;
  font-weight:700;
  text-decoration:none;
}
.btn-primary{
  color:#fff;
  background:var(--primary);
}
.btn-primary:hover{
  transform:translateY(-1px);
  opacity:.92;
}
.btn-secondary{
  color:#111827;
  background:#fff;
  border:1px solid var(--border);
}
.btn-secondary:hover{
  border-color:#cbd5e1;
  background:#f8fafc;
}
.navbar{
  position:relative;
  z-index:50;
  width:100%;
  background:#fff;
  border-bottom:1px solid var(--border);
}
.nav-inner{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
}
.logo{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  color:var(--text);
  min-width:0;
}
.logo img{
  width:auto;
  height:38px;
  max-width:180px;
  object-fit:contain;
}
.logo-text{
  font-size:17px;
  font-weight:800;
  white-space:nowrap;
}
.nav-menu{
  display:flex;
  align-items:center;
  gap:30px;
}
.nav-link{
  color:#4b5563;
  font-size:14px;
  font-weight:600;
  text-decoration:none;
}
.nav-link:hover{
  color:var(--primary);
}
.nav-toggle{
  display:none;
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:9px;
  background:#fff;
  cursor:pointer;
}
.mobile-menu{
  display:none;
  border-top:1px solid var(--border);
  background:#fff;
}
.mobile-menu.open{
  display:block;
}
.mobile-menu a{
  display:block;
  padding:15px 20px;
  color:#374151;
  text-decoration:none;
  border-bottom:1px solid #f1f5f9;
  font-size:14px;
  font-weight:600;
}
.grid-2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:60px;
  align-items:center;
}
.grid-3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:22px;
}
.grid-4{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:20px;
}
.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:28px;
}
.card-icon{
  width:46px;
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  background:#eff6ff;
  color:var(--primary);
  margin-bottom:20px;
}
.card h3{
  margin:0;
  font-size:17px;
  font-weight:700;
}
.card p{
  margin:11px 0 0;
  color:var(--muted);
  font-size:14px;
  line-height:1.75;
}
.image-box{
  overflow:hidden;
  border-radius:18px;
  border:1px solid var(--border);
  background:#f8fafc;
}
.image-box img{
  width:100%;
  height:100%;
  min-height:360px;
  object-fit:cover;
}
.text-content h2{
  margin:0;
  font-size:clamp(30px,4vw,44px);
  line-height:1.15;
  font-weight:800;
  letter-spacing:-.03em;
}
.text-content p{
  color:var(--muted);
  line-height:1.8;
  margin:20px 0 0;
}
.process{
  position:relative;
}
.process-number{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  font-size:14px;
  font-weight:800;
  margin-bottom:20px;
}
.cta{
  padding:80px 20px;
  background:var(--primary);
  color:#fff;
}
.cta-inner{
  max-width:850px;
  margin:auto;
  text-align:center;
}
.cta h2{
  margin:0;
  font-size:clamp(30px,4vw,46px);
  line-height:1.15;
  font-weight:800;
}
.cta p{
  margin:18px auto 0;
  max-width:650px;
  line-height:1.8;
  color:rgba(255,255,255,.8);
}
.cta .btn{
  margin-top:30px;
  background:#fff;
  color:var(--primary);
}
.footer{
  background:#0f172a;
  color:#fff;
  padding:70px 20px 25px;
}
.footer-grid{
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr;
  gap:50px;
}
.footer h3{
  margin:0 0 18px;
  font-size:15px;
  font-weight:700;
}
.footer p{
  color:#94a3b8;
  font-size:14px;
  line-height:1.8;
}
.footer a{
  display:block;
  color:#94a3b8;
  text-decoration:none;
  font-size:14px;
  margin-bottom:11px;
}
.footer a:hover{
  color:#fff;
}
.footer-bottom{
  margin-top:50px;
  padding-top:22px;
  border-top:1px solid rgba(255,255,255,.1);
  color:#64748b;
  font-size:13px;
}
.empty-state{
  min-height:100px;
}
[data-section="hidden"]{
  display:none!important;
}
@media(max-width:900px){
  .nav-menu{display:none}
  .nav-toggle{display:block}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-2{grid-template-columns:1fr;gap:35px}
  .footer-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){
  .section{padding:70px 18px}
  .hero{min-height:620px}
  .hero-content{padding:80px 18px}
  .hero-title{font-size:42px}
  .hero-description{font-size:15px}
  .grid-3,.grid-4{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr}
  .logo-text{display:none}
}
</style>
</head>

<body>

<!-- ==================================================
     NAVIGATION
================================================== -->
<header class="navbar">
  <div class="container nav-inner">

    <a id="site-logo-link" class="logo" href="/">
      <img id="site-logo" src="" alt="">
      <span id="site-name" class="logo-text"></span>
    </a>

    <nav id="desktop-navigation" class="nav-menu">
      <!-- CMS NAVIGATION -->

    <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Menu">

    </button>

  </div>

  <div id="mobile-navigation" class="mobile-menu">

  </div>

<!-- ==================================================
     HERO

  <div class="hero-bg">

  <div class="hero-content">

<section id="cms-section" class="section" style="background:var(--surface)" data-section-key="cms">

<section id="benefits-section" class="section" data-section-key="keunggulan">

  <div class="container">

    <div class="section-heading">

      <div id="benefits-eyebrow" class="eyebrow"></div>

      <h2 id="benefits-title"></h2>

      <p id="benefits-description"></p>

    </div>

    <div id="benefits-items" class="grid-2">

<!-- ==================================================

================================================== -->
<section id="process-section" class="section" style="background:var(--surface)" data-section-key="proses">

  <div class="container">

      <div id="process-eyebrow" class="eyebrow"></div>

</section>


<!-- ==================================================
     FOOTER
================================================== -->
<footer class="footer">

  <div class="container">

    <div class="footer-grid">

      <div>
        <a id="footer-logo-link" href="/">
          <img id="footer-logo" src="" alt="" style="height:38px;width:auto;max-width:180px;object-fit:contain;">

      </div>

        <h3 id="footer-navigation-title"></h3>

          <!-- CMS FOOTER NAVIGATION -->
        </div>
      </div>

      <div>
        <h3 id="footer-contact-title"></h3>
        <div id="footer-contact"></div>
      </div>

    </div>

    <div id="footer-copyright" class="footer-bottom"></div>

  </div>

</footer>


<script>
(function(){

"use strict";

/* ==================================================
   KONFIGURASI
================================================== */

const API = {
  settings:"/api/site-settings",
  navigation:"/api/navigation",
  page:"/api/pages?slug=/",
  seo:"/api/seo-settings"
};


/* ==================================================
   HELPER
================================================== */

function $(id){
  return document.getElementById(id);
}

function setText(id,value){
  const el=$(id);
  if(el) el.textContent=value||"";
}

function setHTML(id,value){
  const el=$(id);
  if(el) el.innerHTML=value||"";
}

function setAttr(id,attr,value){
  const el=$(id);
  if(el && value) el.setAttribute(attr,value);
}

function show(id){
  const el=$(id);
  if(el) el.removeAttribute("data-section","hidden");
}

function hide(id){
  const el=$(id);
  if(el) el.setAttribute("data-section","hidden");
}

function escapeHTML(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function safeURL(value){
  if(!value)return"#";
  return value;
}

async function getJSON(url){
  const response=await fetch(url,{
    headers:{
      "Accept":"application/json"
    },
    cache:"no-store"
  });

  if(!response.ok){
    throw new Error("HTTP "+response.status);
  }

  return response.json();
}


/* ==================================================
   THEME
================================================== */

function applyTheme(settings){

  if(!settings)return;

  const root=document.documentElement;

  if(settings.primary_color){
    root.style.setProperty(
      "--primary",
      settings.primary_color
    );
  }

  if(settings.secondary_color){
    root.style.setProperty(
      "--secondary",
      settings.secondary_color
    );
  }

}


/* ==================================================
   SITE SETTINGS
================================================== */

function renderSettings(settings){

  if(!settings)return;

  applyTheme(settings);

  setText("site-name",settings.site_name);

  setAttr(
    "site-logo",
    "src",
    settings.logo_url
  );

  setAttr(
    "site-logo",
    "alt",
    settings.site_name
  );

  setAttr(
    "footer-logo",
    "src",
    settings.logo_url
  );

  setAttr(
    "footer-logo",
    "alt",
    settings.site_name
  );

  setText(
    "footer-description",
    settings.description
  );

  setText(
    "footer-copyright",
    settings.copyright_text
  );

  if(settings.contact_email){
    setHTML(
      "footer-contact",
      `<a href="mailto:${escapeHTML(settings.contact_email)}">${escapeHTML(settings.contact_email)}</a>`
    );
  }

  if(settings.site_title){
    document.title=settings.site_title;
  }

}


/* ==================================================
   SEO
================================================== */

function renderSEO(seo){

  if(!seo)return;

  if(seo.meta_title){
    document.title=seo.meta_title;
    setAttr(
      "site-title",
      "content",
      seo.meta_title
    );
  }

  setAttr(
    "meta-description",
    "content",
    seo.meta_description
  );

  setAttr(
    "meta-robots",
    "content",
    seo.robots
  );

  setAttr(
    "canonical-url",
    "href",
    seo.canonical_url||location.href
  );

  setAttr(
    "og-title",
    "content",
    seo.og_title||seo.meta_title
  );

  setAttr(
    "og-description",
    "content",
    seo.og_description||seo.meta_description
  );

  setAttr(
    "og-image",
    "content",
    seo.og_image
  );

}


/* ==================================================
   NAVIGATION
================================================== */

function renderNavigation(items){

  const desktop=$("desktop-navigation");
  const mobile=$("mobile-navigation");

  if(!desktop || !mobile)return;

  desktop.innerHTML="";
  mobile.innerHTML="";

  (items||[])
    .filter(item=>Number(item.is_visible)!==0)
    .sort((a,b)=>Number(a.sort_order||0)-Number(b.sort_order||0))
    .forEach(item=>{

      const url=safeURL(item.url);
      const target=item.target||"_self";

      const desktopLink=document.createElement("a");
      desktopLink.className="nav-link";
      desktopLink.href=url;
      desktopLink.target=target;
      desktopLink.textContent=item.label||"";

      desktop.appendChild(desktopLink);

      const mobileLink=document.createElement("a");
      mobileLink.href=url;
      mobileLink.target=target;
      mobileLink.textContent=item.label||"";

      mobile.appendChild(mobileLink);

    });

}


/* ==================================================
   HERO
================================================== */

function renderHero(section){

  if(!section){
    hide("hero-section");
    return;
  }

  show("hero-section");

  const data=section.data||section;

  setText("hero-eyebrow",data.subtitle);
  setText("hero-title",data.title);
  setText("hero-description",data.content);

  if(data.image_url){
    setAttr(
      "hero-image",
      "src",
      data.image_url
    );

    setAttr(
      "hero-image",
      "alt",
      data.title
    );
  }

  const actions=$("hero-actions");

  if(actions){

    actions.innerHTML="";

    if(data.settings_json){

      let settings={};

      try{
        settings=typeof data.settings_json==="string"
          ?JSON.parse(data.settings_json)
          :data.settings_json;
      }catch(e){}

      if(settings.primary_label){

        actions.innerHTML+=`
          <a
            class="btn btn-primary"
            href="${escapeHTML(safeURL(settings.primary_url))}"
          >
            ${escapeHTML(settings.primary_label)}
          </a>
        `;

      }

      if(settings.secondary_label){

        actions.innerHTML+=`
          <a
            class="btn btn-secondary"
            href="${escapeHTML(safeURL(settings.secondary_url))}"
          >
            ${escapeHTML(settings.secondary_label)}
          </a>
        `;

      }

    }

  }

}


/* ==================================================
   ABOUT
================================================== */

function renderAbout(section){

  if(!section){
    hide("about-section");
    return;
  }

  show("about-section");

  const data=section.data||section;

  setText("about-eyebrow",data.subtitle);
  setText("about-title",data.title);

  setHTML(
    "about-content",
    data.content||""
  );

  if(data.image_url){

    setAttr(
      "about-image",
      "src",
      data.image_url
    );

    setAttr(
      "about-image",
      "alt",
      data.title
    );

  }

}


/* ==================================================
   SECTION ITEMS
================================================== */

function createItemCard(item){

  const div=document.createElement("div");

  div.className="card";

  div.innerHTML=`

    <div class="card-icon">
      ${item.icon||"•"}
    </div>

    <h3>
      ${escapeHTML(item.title||"")}
    </h3>

    <p>
      ${escapeHTML(item.description||item.subtitle||"")}
    </p>

  `;

  return div;

}

function renderItemSection(section,containerId,sectionId){

  const container=$(containerId);

  if(!container)return;

  if(!section){

    hide(sectionId);
    return;

  }

  show(sectionId);

  const data=section.data||section;

  setText(
    sectionId.replace("-section","-eyebrow"),
    data.subtitle
  );

  setText(
    sectionId.replace("-section","-title"),
    data.title
  );

  setText(
    sectionId.replace("-section","-description"),
    data.content
  );

  container.innerHTML="";

  const items=data.items||section.items||[];

  items
    .filter(item=>Number(item.is_visible)!==0)
    .sort((a,b)=>Number(a.sort_order||0)-Number(b.sort_order||0))
    .forEach(item=>{
      container.appendChild(
        createItemCard(item)
      );
    });

}


/* ==================================================
   CONTACT
================================================== */

function renderContact(section,settings){

  if(!section){

    hide("contact-section");
    return;

  }

  show("contact-section");

  const data=section.data||section;

  setText(
    "contact-title",
    data.title
  );

  setText(
    "contact-description",
    data.content
  );

  const action=$("contact-action");

  if(!action)return;

  let url="#";

  if(settings){

    if(settings.whatsapp){

      const number=String(settings.whatsapp)
        .replace(/\D/g,"");

      url="https://wa.me/"+number;

    }else if(settings.contact_email){

      url="mailto:"+settings.contact_email;

    }

  }

  action.innerHTML=`
    <a
      class="btn"
      href="${escapeHTML(url)}"
    >
      Hubungi Kami
    </a>
  `;

}


/* ==================================================
   FOOTER
================================================== */

function renderFooterNavigation(items){

  const container=$("footer-navigation");

  if(!container)return;

  container.innerHTML="";

  (items||[])
    .filter(item=>Number(item.is_visible)!==0)
    .sort((a,b)=>Number(a.sort_order||0)-Number(b.sort_order||0))
    .forEach(item=>{

      const link=document.createElement("a");

      link.href=safeURL(item.url);
      link.target=item.target||"_self";
      link.textContent=item.label||"";

      container.appendChild(link);

    });

}


/* ==================================================
   PAGE
================================================== */

function normalizeSections(page){

  if(!page)return[];

  if(Array.isArray(page.sections)){
    return page.sections;
  }

  if(page.data && Array.isArray(page.data.sections)){
    return page.data.sections;
  }

  return[];

}

function findSection(sections,key){

  return sections.find(
    section=>section.section_key===key
  );

}


/* ==================================================
   LOAD PAGE
================================================== */

async function loadPage(){

  const page=await getJSON(API.page);

  const sections=normalizeSections(page);

  renderHero(
    findSection(sections,"hero")
  );

  renderAbout(
    findSection(sections,"tentang")
  );

  renderItemSection(
    findSection(sections,"cms"),
    "cms-items",
    "cms-section"
  );

  renderItemSection(
    findSection(sections,"keunggulan"),
    "benefits-items",
    "benefits-section"
  );

  renderItemSection(
    findSection(sections,"proses"),
    "process-items",
    "process-section"
  );

  renderContact(
    findSection(sections,"kontak"),
    window.__SITE_SETTINGS__
  );

}


/* ==================================================
   MOBILE MENU
================================================== */

function initMobileMenu(){

  const button=$("nav-toggle");
  const menu=$("mobile-navigation");

  if(!button||!menu)return;

  button.addEventListener("click",function(){

    menu.classList.toggle("open");

  });

  menu.addEventListener("click",function(event){

    if(event.target.tagName==="A"){
      menu.classList.remove("open");
    }

  });

}


/* ==================================================
   INIT
================================================== */

async function init(){

  try{

    const [
      settings,
      navigation,
      seo
    ]=await Promise.all([

      getJSON(API.settings),
      getJSON(API.navigation),
      getJSON(API.seo)

    ]);

    window.__SITE_SETTINGS__=
      settings.data||settings;

    renderSettings(
      window.__SITE_SETTINGS__
    );

    renderNavigation(
      navigation.data||navigation.items||navigation
    );

    renderFooterNavigation(
      navigation.data||navigation.items||navigation
    );

    renderSEO(
      seo.data||seo
    );

    await loadPage();

    initMobileMenu();

  }catch(error){

    console.error(
      "ZWS Template Error:",
      error
    );

  }

}

init();

})();
</script>
